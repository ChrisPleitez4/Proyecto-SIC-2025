{% extends "base.html" %}
{% load static %}

{% block title %}Crear Periodo Contable{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/periodos.css' %}">

<div class="periodos-container">
    <h2>Crear Nuevo Periodo Contable</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" id="form-periodo">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>

        <div class="form-buttons">
            <button type="submit">Crear Periodo</button>
            <a href="{% url 'lista_periodos' %}" class="cancelar">Cancelar</a>
        </div>
    </form>
</div>

<script>
document.getElementById('form-periodo').addEventListener('submit', function(e) {
    const fechaInicio = new Date(document.getElementById('id_fecha_inicio').value);
    const fechaFin = new Date(document.getElementById('id_fecha_fin').value);

    if (fechaFin < fechaInicio) {
        e.preventDefault();
        alert('La fecha de fin no puede ser anterior a la fecha de inicio.');
    }
});
</script>
{% endblock %}
